name: Обновить анимацию вкладов

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Создать светлую и тёмную анимации
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0891B2&color_dots=#F8FAFC,#CFFAFE,#A5F3FC,#67E8F9,#8B5CF6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00E5FF&color_dots=#0B132B,#19325C,#254D83,#326CA3,#8B5CF6

      - name: Опубликовать SVG в ветке output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
